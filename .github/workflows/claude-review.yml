name: Claude Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: >-
      ${{
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Ensure Claude token exists
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN is not set."
          exit 1

      - name: Checkout PR head (issue_comment on PR)
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Ensure base branch ref for Claude diff tooling
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch --no-tags --prune --depth=100 origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          git rev-parse --verify "refs/remotes/origin/${BASE_BRANCH}"

      - name: Checkout default ref
        if: ${{ !(github.event_name == 'issue_comment' && github.event.issue.pull_request) }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@ea36d6abdedc17fc2a671b36060770b208a6f8f1 # v1.0.51 (pinned to avoid current SDK AJV crash)
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true # temporary for root-cause diagnosis of @claude failure
          claude_args: |
            --max-turns 10
            --setting-sources project,local
